<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Initiative Planner Pro app icon</title>
  <desc>A warm gold initiative ring surrounding an original horned monster token on a deep bordeaux macOS icon tile.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#721F35"/>
      <stop offset="0.52" stop-color="#481522"/>
      <stop offset="1" stop-color="#241018"/>
    </linearGradient>
    <radialGradient id="tileLight" cx="34%" cy="22%" r="82%">
      <stop offset="0" stop-color="#B45964" stop-opacity="0.30"/>
      <stop offset="0.48" stop-color="#6A2132" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#180B11" stop-opacity="0.38"/>
    </radialGradient>
    <linearGradient id="brass" x1="0.18" y1="0.08" x2="0.82" y2="0.94">
      <stop offset="0" stop-color="#FFE2A0"/>
      <stop offset="0.28" stop-color="#E8B85B"/>
      <stop offset="0.68" stop-color="#B9742F"/>
      <stop offset="1" stop-color="#7A3D1E"/>
    </linearGradient>
    <linearGradient id="token" x1="0.22" y1="0.08" x2="0.80" y2="0.94">
      <stop offset="0" stop-color="#3A1C2A"/>
      <stop offset="0.58" stop-color="#221019"/>
      <stop offset="1" stop-color="#130A0F"/>
    </linearGradient>
    <linearGradient id="creature" x1="0.22" y1="0.08" x2="0.78" y2="0.94">
      <stop offset="0" stop-color="#FFF0C5"/>
      <stop offset="0.52" stop-color="#EAC578"/>
      <stop offset="1" stop-color="#B97532"/>
    </linearGradient>
    <clipPath id="tileClip">
      <rect x="58" y="52" width="908" height="908" rx="220"/>
    </clipPath>
  </defs>

  <!-- Transparent canvas; the inset tile follows current macOS icon proportions. -->
  <rect x="70" y="72" width="884" height="894" rx="216" fill="#10080D" opacity="0.62"/>
  <rect x="58" y="52" width="908" height="908" rx="220" fill="url(#tile)"/>
  <g clip-path="url(#tileClip)">
    <rect x="58" y="52" width="908" height="908" fill="url(#tileLight)"/>
    <path d="M80 262 C248 107 594 78 910 212 L910 84 L80 84 Z" fill="#F8C97B" opacity="0.07"/>
    <path d="M87 804 C308 694 694 724 946 590 L946 956 L87 956 Z" fill="#12080D" opacity="0.20"/>
  </g>
  <rect x="62" y="56" width="900" height="900" rx="216" fill="none" stroke="#D09149" stroke-opacity="0.52" stroke-width="8"/>
  <path d="M260 74 H758 C862 74 940 153 943 256" fill="none" stroke="#FFD990" stroke-opacity="0.24" stroke-width="7" stroke-linecap="round"/>

  <!-- Initiative ring: one dominant circular read, with restrained order markers. -->
  <circle cx="512" cy="500" r="326" fill="none" stroke="#12090E" stroke-opacity="0.60" stroke-width="92"/>
  <circle cx="512" cy="494" r="320" fill="none" stroke="url(#brass)" stroke-width="70"/>
  <circle cx="512" cy="494" r="283" fill="none" stroke="#FFE3A0" stroke-opacity="0.34" stroke-width="5"/>
  <circle cx="512" cy="494" r="357" fill="none" stroke="#A85838" stroke-opacity="0.58" stroke-width="6"/>

  <g fill="#30111D" opacity="0.92">
    <path d="M494 151 H530 L523 206 H501 Z"/>
    <path d="M494 782 H530 L523 837 H501 Z"/>
    <path d="M169 476 V512 L224 505 V483 Z"/>
    <path d="M800 476 V512 L855 505 V483 Z"/>
  </g>
  <g fill="#FFE3A0" opacity="0.68">
    <circle cx="700" cy="236" r="9"/>
    <circle cx="758" cy="296" r="8"/>
    <circle cx="794" cy="368" r="7"/>
  </g>

  <!-- Central token and original horned creature silhouette. -->
  <circle cx="512" cy="510" r="224" fill="#12090E" opacity="0.56"/>
  <circle cx="512" cy="500" r="214" fill="url(#token)" stroke="#F0BE62" stroke-width="17"/>
  <circle cx="512" cy="500" r="187" fill="none" stroke="#FFE6A9" stroke-opacity="0.20" stroke-width="4"/>

  <path d="M512 328
           C470 328 438 345 411 374
           L350 328
           C350 391 370 438 409 468
           C390 501 390 548 408 587
           C429 633 466 658 512 683
           C558 658 595 633 616 587
           C634 548 634 501 615 468
           C654 438 674 391 674 328
           L613 374
           C586 345 554 328 512 328 Z"
        fill="#10080D" opacity="0.48" transform="translate(0 10)"/>
  <path d="M512 328
           C470 328 438 345 411 374
           L350 328
           C350 391 370 438 409 468
           C390 501 390 548 408 587
           C429 633 466 658 512 683
           C558 658 595 633 616 587
           C634 548 634 501 615 468
           C654 438 674 391 674 328
           L613 374
           C586 345 554 328 512 328 Z"
        fill="url(#creature)"/>

  <!-- Strong facial cut-outs survive the 16 px reduction. -->
  <path d="M425 459 C452 437 482 438 500 461 C479 482 449 489 421 474 Z" fill="#26101A"/>
  <path d="M599 459 C572 437 542 438 524 461 C545 482 575 489 603 474 Z" fill="#26101A"/>
  <path d="M512 480 L548 551 L512 579 L476 551 Z" fill="#8F4A29" opacity="0.92"/>
  <path d="M448 592 C486 610 538 610 576 592 C566 628 542 650 512 668 C482 650 458 628 448 592 Z" fill="#2B111B"/>
  <path d="M476 603 L497 610 L486 635 Z M548 603 L527 610 L538 635 Z" fill="#FFF0C5"/>
  <path d="M403 383 C428 356 461 344 490 341" fill="none" stroke="#FFF4D4" stroke-opacity="0.42" stroke-width="10" stroke-linecap="round"/>

  <!-- A single controlled highlight reinforces material without glassy glare. -->
  <path d="M249 332 A320 320 0 0 1 497 176" fill="none" stroke="#FFF1C7" stroke-opacity="0.33" stroke-width="10" stroke-linecap="round"/>
</svg>
