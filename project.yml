name: InitiativePlannerProMac
options:
  bundleIdPrefix: com.cramleo
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
targets:
  InitiativePlannerProMac:
    type: application
    platform: macOS
    sources:
      - App
      - Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cramleo.InitiativePlannerProMac
        PRODUCT_NAME: Initiative Planner Pro
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Initiative Planner Pro
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Cramleo"
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Initiative Planner Pro
        CFBundleDisplayName: Initiative Planner Pro
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleShortVersionString: "1.1.1"
        CFBundleVersion: "111"
        LSMinimumSystemVersion: "15.0"
        LSApplicationCategoryType: public.app-category.games
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "Copyright © 2026 Cramleo"
  InitiativePlannerProMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cramleo.InitiativePlannerProMacTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ""
        BUNDLE_LOADER: ""
schemes:
  InitiativePlannerProMac:
    build:
      targets:
        InitiativePlannerProMac: all
        InitiativePlannerProMacTests: [test]
    test:
      targets:
        - InitiativePlannerProMacTests
